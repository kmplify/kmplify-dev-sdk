# A container app with one declared outbound host.
# The digest below is an EXAMPLE value, not a published image: replace it with
# the digest of your own image (docker buildx imagetools inspect <image>).
apiVersion: kmplify.app/v1
id: kmplify-examples/hello-container
version: 0.1.0
lane: container
artifact:
  image: registry.kmplify.io/kmplify-examples/hello-container@sha256:1111111111111111111111111111111111111111111111111111111111111111
resources:
  cpus: 1
  mem_mb: 512
requirements:
  os: [linux]
  min_ram_mb: 2048
  min_disk_mb: 600
  contents:
    - { kind: image, name: hello-container image, size_mb: 180 }
    - { kind: model, name: tiny sentiment model, size_mb: 250, fetched: on_first_run }
isolation: gvisor
network:
  mode: egress
  allow:
    - api.example.com:443
permissions:
  - dws.kv
entrypoint:
  port: 8080
  health: /healthz
  ready_timeout_s: 60
limits:
  max_runtime_s: 900
  max_concurrency: 4
data_class: personal
pricing:
  model: per_run
  price_cents: 5
