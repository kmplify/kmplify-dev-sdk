[package]
name = "kmplify-cli"
version = "0.1.0"
edition = "2021"
description = "KMPLIFY developer CLI: scaffold, validate, sign and verify serverless apps (kmplify.app/v1)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "kmplify"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3"
